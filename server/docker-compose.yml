# Uzikext server. The only things to set: the two folders on the left of the ":" in volumes. Everything else
# is set from Uzikext (⋮ → Sync), and devices pair with a 6-digit code: no token to invent or type.
#
#   Start:   docker compose up -d        (or Container Station → Create → Application → paste this file)
#   Pair:    open http://<this machine's address>:8787 → "Get a pairing code", or Uzikext → Sync → Find my server
#   Update:  docker compose pull && docker compose up -d     (Uzikext's ⋮ → Sync says when there's a new one)

services:
  uzikext-server:
    image: ghcr.io/YOUR-GITHUB-NAME/uzikext-server:4
    build: .                                  # (or build it here: docker compose build)
    container_name: uzikext-server
    restart: unless-stopped
    ports:
      - "8787:8787"
    # network_mode: host                      # instead of "ports": Uzikext then finds the server by its name
    #                                         # (mDNS). Without it, Uzikext finds it by looking at the
    #                                         # addresses of your home network, which works too.
    volumes:
      # 1. Where the server keeps its database and backups. Keep this folder.
      - ./data:/data                         # (a "data" folder next to this file)
      # 2. Your music, read-only, for the background analysis: the folder you add in Uzikext, or one above it
      #    (the server finds which by itself). Leave it out to have no background analysis.
      - /path/to/your/music:/music:ro
      # 3. Optional: a folder on ANOTHER disk for a copy of every backup (a USB drive, another share). It's
      #    then offered in ⋮ → Backups → A copy on another disk. It must exist (an unplugged drive is reported, not filled).
      # - /path/to/another/disk/uzikext-backups:/backup-copy
    # Only for special cases (all optional): uncomment "environment:" and the lines you need.
    # environment:
      # ALLOW_FROM: "home"            # who may connect: "home" (your home network and VPN, the default),
      #                               # "any" (a rented server behind your own HTTPS), or addresses/CIDRs
      # SYNC_TOKEN: "…"               # the old shared token, for devices not paired yet; switch it off in the
      #                               # ⋮ → Sync → Devices once they all are (they get their own key by themselves)
      # TELEGRAM_BRIDGE_URL: "off"    # no Telegram at all
      # MDNS: "off"
      # TZ: "Europe/London"         # your time zone, for the times in the log
