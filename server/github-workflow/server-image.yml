# Builds the Uzikext server image for Intel/AMD (amd64) and ARM (arm64) NAS and computers, and publishes it on
# GitHub's registry (ghcr.io/<your GitHub name>/uzikext-server).
#
# Setup, once: put this file in your repository as .github/workflows/server-image.yml, with the server's files
# in a folder named "server" (change SERVER_DIR below otherwise). After the first build: GitHub → your profile →
# Packages → uzikext-server → Package settings → Change visibility → Public (so a NAS can pull it without
# signing in).
#
# A release: push a tag server-v<version>, e.g.  git tag server-v4.0.0 && git push origin server-v4.0.0
# (the version must match SERVER_RELEASE in server.js). Then publish a GitHub release for that tag: the
# servers already running see it and the Sync panel says "update available".
name: server image

on:
  push:
    tags: ['server-v*']
  workflow_dispatch:

env:
  SERVER_DIR: server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="${GITHUB_REF_NAME#server-v}"
          [ "$GITHUB_REF_TYPE" = tag ] || tag="dev"
          echo "image=ghcr.io/$owner/uzikext-server" >> "$GITHUB_OUTPUT"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "major=${tag%%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVER_DIR }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: UPDATE_REPO=${{ github.repository }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.major }}
            ${{ steps.v.outputs.image }}:latest
